name: benchmark-comparison

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: goldmark v1.8.5
            dir: _benchmark/comparison/v1
          - name: goldmark v2.0.0
            dir: _benchmark/comparison/v2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Run benchmark
        run: |
          cd "${{ matrix.target.dir }}"
          go test -bench . -benchmem -run '^$' -count 5 | tee benchmark.out

      - name: Publish benchmark summary
        run: |
          {
            echo "### ${{ matrix.target.name }}"
            echo
            echo '```text'
            cat "${{ matrix.target.dir }}/benchmark.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
