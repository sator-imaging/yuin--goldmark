name: benchmark-comparison

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  compare:
    # Don't use matrix due to the runner spec cannot be chosen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: 1.27.x
          check-latest: true

      - name: Run benchmark
        run: |
          run_benchmark() {
            local version="$1"

            cd "_benchmark/comparison/$version"
            go test -bench . -benchmem -run '^$' -count 5 | tee benchmark.out

            {
              echo "## $version"
              echo
              echo '```text'
              cat benchmark.out
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "Go version: ${{ steps.setup-go.outputs.go-version }}" \
            >> "$GITHUB_STEP_SUMMARY"

          run_benchmark v2
          run_benchmark v1
